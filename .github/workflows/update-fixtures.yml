name: Update Official Season Fixtures

on:
  schedule:
    - cron: '0 6 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync 34-week schedule
        run: python3 scripts/sync_fixtures.py

      - name: Commit and push updated fixtures if changed
        run: |
          if git diff --quiet store_safe_catalog.json manifest.json; then
            echo "No fixture changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store_safe_catalog.json manifest.json
          git commit -m "chore: update 34-week season fixtures"
          git push
